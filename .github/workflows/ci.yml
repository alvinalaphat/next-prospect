name: CI

# Vercel's Git integration owns preview and production deployments. This
# workflow supplies the checks Vercel does not: types, deterministic product
# scoring, the isolated approval path, and a production bundle.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Dependency installation and project scripts run with a read-only token.
permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.17.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Evaluate catalog and scoring
        run: pnpm run eval:v2

      - name: Test isolated approval path
        run: pnpm run test:v2-e2e

      - name: Build production bundle
        run: pnpm run build
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: 1
